<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projetos - Lógica de Programação | SENAI Ribas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 flex flex-col min-h-screen font-sans">
    
    <!-- Cabeçalho Institucional -->
    <header class="bg-[#002776] border-b-4 border-[#E3000F] text-white py-8 px-4 shadow-md">
        <div class="max-w-6xl mx-auto text-center">
            <h1 class="text-3xl md:text-4xl font-extrabold uppercase tracking-wide">
                Página de Projetos
            </h1>
            <p class="text-lg md:text-xl mt-2 font-light text-blue-100">
                1ª Turma de Lógica de Programação do SENAI Ribas
            </p>
        </div>
    </header>

    <main class="flex-grow max-w-6xl mx-auto w-full p-6 my-8">
        
        <!-- Formulário de Submissão -->
        <div class="bg-white p-8 rounded-xl shadow-lg border border-gray-200 mb-12 max-w-2xl mx-auto">
            <div class="flex items-center justify-center mb-6">
                <i class="fa-solid fa-cloud-arrow-up text-3xl text-[#E3000F] mr-3"></i>
                <h2 class="text-2xl font-bold text-[#002776]">Registrar Projeto</h2>
            </div>
            
            <form id="projectForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Nome do Aluno</label>
                    <input type="text" id="nome" required class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-[#002776] focus:border-[#002776] transition-all bg-gray-50">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Nome do Projeto</label>
                    <input type="text" id="nomeProjeto" required placeholder="Ex: Simulador de Logística" class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-[#002776] focus:border-[#002776] transition-all bg-gray-50">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Link do Projeto (GitHub Pages)</label>
                    <input type="url" id="link" required placeholder="https://aluno.github.io/projeto" class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-[#002776] focus:border-[#002776] transition-all bg-gray-50">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Foto do Aluno</label>
                    <input type="file" id="foto" accept="image/*" capture="user" required class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-[#002776] hover:file:bg-blue-100 cursor-pointer border border-gray-200 p-2 rounded-lg bg-gray-50">
                </div>
                <button type="submit" id="btnSubmit" class="w-full bg-[#E3000F] text-white font-bold py-3 px-4 rounded-lg hover:bg-red-700 transition-colors shadow-md mt-4 flex justify-center items-center">
                    <i class="fa-solid fa-paper-plane mr-2"></i> Enviar Projeto
                </button>
            </form>
        </div>

        <!-- Divisor -->
        <div class="flex items-center mb-8">
            <div class="flex-grow h-px bg-gray-300"></div>
            <h2 class="px-6 text-3xl font-bold text-[#002776] uppercase tracking-wider">Galeria de Trabalhos</h2>
            <div class="flex-grow h-px bg-gray-300"></div>
        </div>

        <!-- Galeria -->
        <div id="gallery" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <p class="text-gray-500 col-span-full text-center text-lg animate-pulse" id="loadingMsg">
                <i class="fa-solid fa-spinner fa-spin mr-2"></i> Carregando projetos da turma...
            </p>
        </div>
    </main>

    <!-- Rodapé -->
    <footer class="bg-[#002776] text-white py-6 border-t border-blue-800 mt-auto">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <p class="text-blue-200 mb-1">Desenvolvido para atividades acadêmicas</p>
            <p class="font-semibold text-lg text-white">
                Responsável Técnico e Professor: <span class="text-yellow-400">Prof. Stepherson Fontoura</span>
            </p>
        </div>
    </footer>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzoP1i833CqQZHCZZm9epH5AMjxXmsrwVwBNjCSxsqMLbKYEqVLQjoC4BNjWKrI4BCItw/exec';

        document.getElementById('projectForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Processando envio...';
            btn.disabled = true;
            btn.classList.add('opacity-75');

            const nome = document.getElementById('nome').value;
            const nomeProjeto = document.getElementById('nomeProjeto').value;
            const link = document.getElementById('link').value;
            const file = document.getElementById('foto').files[0];

            const reader = new FileReader();
            reader.onloadend = async () => {
                const base64String = reader.result;
                
                try {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify({ nome, nomeProjeto, link, foto: base64String }),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        redirect: 'follow'
                    });
                    
                    const responseData = await res.json();
                    
                    if(responseData.status === "sucesso") {
                        alert('Sucesso! O projeto foi registrado.');
                        document.getElementById('projectForm').reset();
                        loadProjects();
                    } else {
                        alert('Erro reportado pelo servidor: ' + responseData.error);
                    }
                } catch (err) {
                    console.error(err);
                    alert('Erro de comunicação. Verifique a sua ligação à internet.');
                } finally {
                    btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-2"></i> Enviar Projeto';
                    btn.disabled = false;
                    btn.classList.remove('opacity-75');
                }
            };
            reader.readAsDataURL(file);
        });

        async function loadProjects() {
            const gallery = document.getElementById('gallery');
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                
                gallery.innerHTML = '';
                
                if(!data || data.length === 0) {
                    gallery.innerHTML = '<div class="col-span-full bg-white p-8 rounded-lg shadow text-center border border-gray-200"><p class="text-gray-500 text-lg">Ainda não existem projetos registados nesta turma.</p></div>';
                    return;
                }

                data.reverse().forEach(aluno => { // .reverse() para mostrar os mais recentes primeiro
                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-xl shadow-lg hover:shadow-xl transition-shadow duration-300 overflow-hidden flex flex-col border border-gray-200 relative group';
                    
                    const thumbnailUrl = `https://image.thum.io/get/width/600/crop/600/${aluno.link}`;

                    card.innerHTML = `
                        <!-- Miniatura do Site -->
                        <div class="h-40 w-full overflow-hidden relative bg-gray-100 border-b border-gray-200">
                            <img src="${thumbnailUrl}" alt="Preview do site" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy">
                            <div class="absolute inset-0 bg-[#002776] bg-opacity-0 group-hover:bg-opacity-20 transition-all duration-300"></div>
                        </div>
                        
                        <!-- Foto do Aluno Sobreposta -->
                        <div class="absolute top-24 left-1/2 transform -translate-x-1/2">
                            <img src="${aluno.foto}" alt="Foto de ${aluno.nome}" class="w-24 h-24 object-cover rounded-full border-4 border-white shadow-md bg-white">
                        </div>

                        <!-- Dados do Projeto -->
                        <div class="p-6 pt-12 flex flex-col flex-grow text-center">
                            <h3 class="text-xl font-bold text-[#002776] mb-1">${aluno.nome}</h3>
                            <p class="text-[#E3000F] font-semibold text-sm uppercase tracking-wide mb-4">${aluno.nomeProjeto}</p>
                            
                            <div class="bg-gray-50 p-3 rounded border border-gray-200 mb-6 text-left break-all">
                                <span class="text-xs font-bold text-gray-500 uppercase block mb-1">Endereço Web:</span>
                                <a href="${aluno.link}" target="_blank" class="text-sm text-blue-600 hover:text-blue-800 hover:underline">
                                    ${aluno.link}
                                </a>
                            </div>
                            
                            <a href="${aluno.link}" target="_blank" class="mt-auto block w-full bg-[#002776] text-white font-semibold py-2 px-4 rounded hover:bg-blue-900 transition-colors shadow">
                                <i class="fa-solid fa-arrow-up-right-from-square mr-2"></i> Acessar Projeto
                            </a>
                        </div>
                    `;
                    gallery.appendChild(card);
                });
            } catch (err) {
                gallery.innerHTML = '<p class="text-red-500 col-span-full text-center p-8 bg-red-50 rounded-lg border border-red-200">Erro ao carregar os projetos. Por favor, atualize a página.</p>';
            }
        }

        loadProjects();
    </script>
</body>
</html>
