<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projetos da Turma</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6 font-sans">
    <div class="max-w-5xl mx-auto">
        
        <div class="bg-white p-6 rounded-lg shadow-md mb-10 max-w-lg mx-auto">
            <h2 class="text-2xl font-bold mb-4 text-center text-gray-800">Registrar Projeto</h2>
            <form id="projectForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nome do Aluno</label>
                    <input type="text" id="nome" required class="mt-1 w-full border border-gray-300 p-2 rounded-md focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Link do GitHub Pages</label>
                    <input type="url" id="link" required placeholder="https://aluno.github.io/projeto" class="mt-1 w-full border border-gray-300 p-2 rounded-md focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Foto (Selfie 3x4)</label>
                    <input type="file" id="foto" accept="image/*" required class="mt-1 w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>
                <button type="submit" id="btnSubmit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-md hover:bg-blue-700 transition">
                    Enviar Projeto
                </button>
            </form>
        </div>

        <h2 class="text-2xl font-bold mb-6 text-gray-800 border-b pb-2">Galeria de Projetos</h2>
        <div id="gallery" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Os cards dos alunos serão carregados aqui -->
            <p class="text-gray-500 col-span-full text-center" id="loadingMsg">Carregando projetos...</p>
        </div>
    </div>

    <script>
        // COLOQUE AQUI A URL GERADA PELO GOOGLE APPS SCRIPT
        const API_URL = 'https://script.google.com/macros/s/AKfycbyeYdIzjtwkRoCPKI9acGW-jGKF0gOShsvdv46LfCFIrrcyvtPWi60_5-r8Ecy7Cqs-/exec';

        document.getElementById('projectForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.innerText = 'Enviando...';
            btn.disabled = true;

            const nome = document.getElementById('nome').value;
            const link = document.getElementById('link').value;
            const file = document.getElementById('foto').files[0];

            const reader = new FileReader();
            reader.onloadend = async () => {
                const base64String = reader.result;
                
                try {
                    await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify({ nome, link, foto: base64String }),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' } // text/plain evita o erro de CORS no preflight do Google
                    });
                    alert('Projeto registrado com sucesso!');
                    document.getElementById('projectForm').reset();
                    loadProjects();
                } catch (err) {
                    alert('Erro ao enviar. Tente novamente.');
                } finally {
                    btn.innerText = 'Enviar Projeto';
                    btn.disabled = false;
                }
            };
            reader.readAsDataURL(file);
        });

        async function loadProjects() {
            const gallery = document.getElementById('gallery');
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                
                gallery.innerHTML = '';
                
                if(data.length === 0) {
                    gallery.innerHTML = '<p class="text-gray-500 col-span-full text-center">Nenhum projeto registrado ainda.</p>';
                    return;
                }

                data.forEach(aluno => {
                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-lg shadow-lg overflow-hidden flex flex-col items-center p-4 border border-gray-200';
                    
                    // URL do Thum.io para gerar a miniatura do site do aluno
                    const thumbnailUrl = `https://image.thum.io/get/width/400/crop/600/${aluno.link}`;

                    card.innerHTML = `
                        <div class="w-24 h-32 mb-3">
                            <img src="${aluno.foto}" alt="Foto de ${aluno.nome}" class="w-full h-full object-cover rounded shadow border border-gray-300">
                        </div>
                        <h3 class="text-lg font-bold text-gray-800 text-center mb-1">${aluno.nome}</h3>
                        <a href="${aluno.link}" target="_blank" class="text-blue-600 text-sm hover:underline mb-3 truncate w-full text-center">
                            Acessar Projeto
                        </a>
                        <div class="w-full mt-auto rounded overflow-hidden border border-gray-300 relative bg-gray-50">
                            <span class="absolute top-1 left-1 bg-black bg-opacity-60 text-white text-[10px] px-1 rounded">Preview</span>
                            <img src="${thumbnailUrl}" alt="Preview do site" class="w-full h-32 object-cover" loading="lazy">
                        </div>
                    `;
                    gallery.appendChild(card);
                });
            } catch (err) {
                gallery.innerHTML = '<p class="text-red-500 col-span-full text-center">Erro ao carregar os dados.</p>';
            }
        }

        // Carrega os projetos ao abrir a página
        loadProjects();
    </script>
</body>
</html>
